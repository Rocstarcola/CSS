<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Gadgetron">
  <defs>
    <mask id="gx-cut">
      <rect width="512" height="512" fill="black"/>
      <!-- Hexagonal ring (outer hex with inner hex hole) -->
      <path fill-rule="evenodd" fill="white" d="M256,26 L455,141 L455,371 L256,486 L57,371 L57,141 Z M256,128 L366.85,192 L366.85,320 L256,384 L145.15,320 L145.15,192 Z"/>
      <!-- Open the right side (the 'mouth' that turns the ring into a G) -->
      <rect x="360" y="222" width="150" height="64" fill="black"/>
      <!-- Inner bar/tongue of the G -->
      <rect x="298" y="256" width="170" height="30" fill="white"/>
    </mask>
  </defs>
  <g mask="url(#gx-cut)">
    <rect x="0" y="0" width="512" height="256" fill="#141414"/>
    <rect x="0" y="256" width="512" height="256" fill="#E8401F"/>
  </g>
</svg>
